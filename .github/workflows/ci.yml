name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-placeholder-secret-minimum-32-chars-ok' }}
          NEXT_PUBLIC_URL: https://dashboard.mec-ci.org
          NEXT_PUBLIC_API_BACKEND_URL: https://admin.mec-ci.org/api/v1
